<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday Arif</title>
<style>
  :root{
    --kraft: #cbb28a;
    --kraft-dark: #a98f63;
    --red-check: #8a2f2a;
    --cream: #f2e9d8;
    --ink: #3a2b1f;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
      linear-gradient(var(--kraft-dark), var(--kraft-dark)) fixed,
      repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 6px);
    background-color: var(--kraft-dark);
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.08), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.10), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(0,0,0,0.08), transparent 50%);
    pointer-events:none;
  }

  #stage{
    position:relative;
    width:100%;
    height:100%;
    perspective: 2400px;
  }

  /* ---------- COVER ---------- */
  #cover-wrap{
    position:absolute;
    top: 8vh;
    left:50%;
    width:min(78vw, 340px);
    aspect-ratio: 472/709;
    cursor:pointer;
    transition: transform .5s ease, opacity .5s ease;
    filter: drop-shadow(0 18px 30px rgba(0,0,0,0.45));
    transform: translateX(-50%) scale(1);
    opacity:1;
  }
  #cover-wrap.hidden{
    opacity:0;
    transform: translateX(-50%) scale(0.85);
    pointer-events:none;
  }
  #cover-img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:4px;
    border: 6px solid #fffdf7;
    display:block;
  }
  #tap-hint{
    position:absolute;
    bottom:-38px;
    left:0; right:0;
    text-align:center;
    color:#fdf6e6;
    font-size:14px;
    letter-spacing:0.5px;
    opacity:0.85;
    animation: pulse 2s infinite ease-in-out;
    font-style: italic;
  }
  @keyframes pulse{
    0%,100%{ opacity:0.55; }
    50%{ opacity:0.95; }
  }

  /* ---------- BOOK / SPREAD ---------- */
  #book{
    position:absolute;
    top: 8vh;
    left:50%;
    width:min(90vw, 760px);
    aspect-ratio: 944/709;
    display:flex;
    opacity:0;
    transform: translateX(-50%) scale(0.9);
    transition: opacity .45s ease, transform .45s ease;
    pointer-events:none;
  }
  #book.show{
    opacity:1;
    transform: translateX(-50%) scale(1);
    pointer-events:auto;
  }

  .page{
    position:relative;
    width:50%;
    height:100%;
    overflow:hidden;
    transform-style: preserve-3d;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  #left-page{
    border-radius: 6px 0 0 6px;
    transform-origin: right center;
  }
  #right-page{
    border-radius: 0 6px 6px 0;
    transform-origin: left center;
    border-left: 2px solid rgba(0,0,0,0.25);
  }
  #book.show #left-page{
    animation: openLeft .7s ease forwards;
  }
  #book.show #right-page{
    animation: openRight .7s ease forwards;
  }
  @keyframes openLeft{
    from{ transform: rotateY(-90deg); }
    to{ transform: rotateY(0deg); }
  }
  @keyframes openRight{
    from{ transform: rotateY(90deg); }
    to{ transform: rotateY(0deg); }
  }

  .page-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
  }

  /* ---------- LETTER INTERACTION ---------- */
  #letter-hit{
    position:absolute;
    left:14%;
    top:26%;
    width:72%;
    height:46%;
    cursor:pointer;
    z-index:5;
  }
  #letter-img{
    position:absolute;
    left:0; top:0;
    width:100%;
    height: 130%;
    object-fit: cover;
    object-position: top;
    border-radius:3px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    transform-origin: bottom center;
    transform: translateY(28%) scale(0.72);
    transition: transform .55s cubic-bezier(.2,.8,.3,1), box-shadow .55s ease;
  }
  #letter-hit.open #letter-img{
    transform: translateY(-4%) scale(1);
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  #letter-hint{
    position:absolute;
    left:0; right:0;
    bottom:6%;
    text-align:center;
    font-size:12px;
    color:#fff9ec;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    opacity:0.9;
    pointer-events:none;
  }

  /* ---------- CANDLE PAGE ---------- */
  #candle-page-inner{
    position:absolute;
    inset:0;
  }
  .flame{
    position:absolute;
    transform-origin: bottom center;
    transition: opacity .25s ease;
    pointer-events:none;
    filter: drop-shadow(0 0 6px rgba(255,180,60,0.55));
  }
  .flame img{
    width:100%;
    height:100%;
    display:block;
  }
  .flame.lit{
    animation: flicker 1.6s ease-in-out infinite;
  }
  .flame.out{
    opacity:0;
  }
  @keyframes flicker{
    0%,100%{ transform: rotate(-2deg) scaleY(1); }
    25%{ transform: rotate(2deg) scaleY(1.04); }
    50%{ transform: rotate(-1deg) scaleY(0.97); }
    75%{ transform: rotate(3deg) scaleY(1.02); }
  }
  .flame.blowing{
    animation: none !important;
  }

  #meter-wrap{
    position:absolute;
    left:8%;
    bottom:6%;
    width:38%;
    max-width:180px;
  }
  #meter-label{
    font-size:11px;
    color:#5a4630;
    background:rgba(255,250,240,0.75);
    display:inline-block;
    padding:2px 7px;
    border-radius:8px;
    margin-bottom:4px;
  }
  #meter-track{
    width:100%;
    height:10px;
    background:rgba(255,255,255,0.55);
    border-radius:6px;
    overflow:hidden;
    border:1px solid rgba(0,0,0,0.2);
  }
  #meter-fill{
    height:100%;
    width:0%;
    background: linear-gradient(90deg,#f6c453,#e8622c);
    transition: width .08s linear;
  }

  #blow-fallback{
    position:absolute;
    right:6%;
    bottom:6%;
    background:#8a2f2a;
    color:#fff9ec;
    border:none;
    padding:9px 14px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
    user-select:none;
  }
  #blow-fallback:active{
    transform: scale(0.96);
  }

  #mic-status{
    position:absolute;
    top:4%;
    left:0; right:0;
    text-align:center;
    font-size:11px;
    color:#6b5738;
    background: rgba(255,250,240,0.0);
    pointer-events:none;
  }

  /* wish overlay */
  #wish-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background: rgba(255,248,232,0.0);
    opacity:0;
    pointer-events:none;
    transition: opacity .5s ease;
    z-index:20;
  }
  #wish-overlay.show{
    opacity:1;
    pointer-events:auto;
    background: rgba(255,248,232,0.28);
  }
  #wish-text{
    font-size: clamp(18px, 4vw, 26px);
    font-weight:700;
    color:#7a2a22;
    text-shadow: 0 2px 8px rgba(255,255,255,0.8);
    text-align:center;
    padding: 10px 18px;
    background: rgba(255,253,247,0.85);
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    margin-bottom:14px;
  }
  #relight-btn{
    background:#3a2b1f;
    color:#fdf6e6;
    border:none;
    padding:9px 18px;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
  }

  canvas#confetti{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:19;
  }

  /* ---------- BACK BUTTON ---------- */
  #back-btn{
    position:fixed;
    top: 3vh;
    left:50%;
    transform: translateX(-50%);
    background: #fffdf7;
    color:#5a4630;
    border: 1px solid rgba(0,0,0,0.15);
    padding: 7px 16px;
    border-radius:18px;
    font-size:13px;
    cursor:pointer;
    display:none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    z-index:30;
  }
  #back-btn.show{ display:block; }

  #https-note{
    position:fixed;
    bottom: 10px;
    left:0; right:0;
    text-align:center;
    font-size:10.5px;
    color:#f2e6cf;
    opacity:0.65;
    padding: 0 12px;
    pointer-events:none;
  }

  @media (max-width: 480px){
    #book{ width:94vw; }
    #stage{ padding-top:6vh; }
  }
</style>
</head>

        <div id="meter-wrap">
          <div id="meter-label">mic level</div>
          <div id="meter-track"><div id="meter-fill"></div></div>
        </div>

        <button id="blow-fallback">hold to blow</button>

        <canvas id="confetti"></canvas>
        <div id="wish-overlay">

<div id="https-note">psst — blowing needs mic access, which only works when this file is hosted over https (not opened directly from disk). use the hold-to-blow button if the mic is blocked.</div>

<script>
(function(){
  "use strict";

  var coverWrap = document.getElementById('cover-wrap');
  var book = document.getElementById('book');
  var backBtn = document.getElementById('back-btn');
  var letterHit = document.getElementById('letter-hit');
  var flames = [
    document.getElementById('flame-left'),
    document.getElementById('flame-middle'),
    document.getElementById('flame-right')
  ];
  var meterFill = document.getElementById('meter-fill');
  var meterLabel = document.getElementById('meter-label');
  var blowFallbackBtn = document.getElementById('blow-fallback');
  var wishOverlay = document.getElementById('wish-overlay');
  var relightBtn = document.getElementById('relight-btn');
  var confettiCanvas = document.getElementById('confetti');
  var ctx = confettiCanvas.getContext('2d');

  var micReady = false;
  var micStream = null;
  var audioCtx = null;
  var analyser = null;
  var dataArray = null;
  var loopRunning = false;

  var blowTime = 0;       // seconds accumulated over threshold
  var lastFrameTime = null;
  var candlesOut = false;
  var fallbackActive = false;
  var THRESHOLD = 0.045;   // RMS threshold for "blowing"
  var EXTINGUISH_TIME = 0.5; // seconds

  var confettiParticles = [];
  var confettiRunning = false;

  // ---------------- COVER -> BOOK ----------------
  coverWrap.addEventListener('click', function(){
    openBook();
    requestMic(); // user gesture present, good moment to ask
  });

  function openBook(){
    coverWrap.classList.add('hidden');
    book.classList.remove('show'); // ensure re-trigger of open animation
    // force reflow so animation restarts if reopened
    void book.offsetWidth;
    book.classList.add('show');
    backBtn.classList.add('show');
    if(!loopRunning){
      loopRunning = true;
      lastFrameTime = null;
      requestAnimationFrame(tick);
    }
  }

  backBtn.addEventListener('click', function(){
    book.classList.remove('show');
    backBtn.classList.remove('show');
    letterHit.classList.remove('open');
    coverWrap.classList.remove('hidden');
  });

  // ---------------- LETTER ----------------
  letterHit.addEventListener('click', function(){
    letterHit.classList.toggle('open');
  });

  // ---------------- MIC SETUP ----------------
  function requestMic(){
    if(micReady || micStream) return;
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      meterLabel.textContent = 'mic not available';
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
      .then(function(stream){
        micStream = stream;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = 0.4;
        dataArray = new Float32Array(analyser.fftSize);
        source.connect(analyser);
        micReady = true;
        meterLabel.textContent = 'mic level';
      })
      .catch(function(err){
        micReady = false;
        meterLabel.textContent = 'mic blocked';
      });
  }

  function getMicVolume(){
    if(!micReady || !analyser) return 0;
    analyser.getFloatTimeDomainData(dataArray);
    var sum = 0;
    for(var i=0;i<dataArray.length;i++){
      sum += dataArray[i]*dataArray[i];
    }
    var rms = Math.sqrt(sum/dataArray.length);
    return rms;
  }

  // ---------------- FALLBACK BUTTON / SPACEBAR ----------------
  function setFallback(active){
    fallbackActive = active;
  }
  blowFallbackBtn.addEventListener('mousedown', function(e){ e.preventDefault(); setFallback(true); });
  blowFallbackBtn.addEventListener('touchstart', function(e){ e.preventDefault(); setFallback(true); }, {passive:false});
  window.addEventListener('mouseup', function(){ setFallback(false); });
  window.addEventListener('touchend', function(){ setFallback(false); });
  window.addEventListener('touchcancel', function(){ setFallback(false); });

  document.addEventListener('keydown', function(e){
    if(e.code === 'Space'){
      e.preventDefault();
      setFallback(true);
    }
  });
  document.addEventListener('keyup', function(e){
    if(e.code === 'Space'){
      e.preventDefault();
      setFallback(false);
    }
  });

  // ---------------- MAIN LOOP ----------------
  function tick(ts){
    if(!lastFrameTime) lastFrameTime = ts;
    var dt = Math.min((ts - lastFrameTime)/1000, 0.1);
    lastFrameTime = ts;

    var vol = getMicVolume();
    var micStrength = Math.min(1, vol / (THRESHOLD*3));
    var isBlowingMic = vol > THRESHOLD;
    var isBlowing = isBlowingMic || fallbackActive;
    var strength = fallbackActive ? 1 : micStrength;

    // update meter (mic based, even if fallback used, show something for feedback)
    var meterPct = fallbackActive ? 100 : Math.min(100, (vol/ (THRESHOLD*3)) * 100);
    meterFill.style.width = meterPct + '%';

    if(!candlesOut){
      if(isBlowing){
        blowTime += dt;
        bendFlames(strength);
      } else {
        blowTime = Math.max(0, blowTime - dt*2.2);
        settleFlames();
      }

      if(blowTime >= EXTINGUISH_TIME){
        extinguishCandles();
      }
    }

    if(confettiRunning){
      stepConfetti();
    }

    if(loopRunning){
      requestAnimationFrame(tick);
    }
  }

  function bendFlames(strength){
    flames.forEach(function(f, i){
      if(f.classList.contains('out')) return;
      f.classList.add('blowing');
      var dir = -1; // bend away from "mouth" direction
      var jitter = (i-1)*4; // slight variance per flame
      var angle = dir * (18 + strength*24) + jitter*strength;
      var scaleY = 1 - strength*0.22;
      f.style.transform = 'rotate(' + angle + 'deg) scaleY(' + scaleY + ')';
      f.style.opacity = String(1 - strength*0.15);
    });
  }

  function settleFlames(){
    flames.forEach(function(f){
      if(f.classList.contains('out')) return;
      if(f.classList.contains('blowing')){
        f.classList.remove('blowing');
        f.style.transform = '';
        f.style.opacity = '';
      }
    });
  }

  function extinguishCandles(){
    candlesOut = true;
    flames.forEach(function(f){
      f.classList.remove('lit');
      f.classList.remove('blowing');
      f.style.transform = '';
      f.classList.add('out');
    });
    blowTime = 0;
    showWish();
  }

  function relight(){
    candlesOut = false;
    blowTime = 0;
    flames.forEach(function(f){
      f.classList.remove('out');
      f.classList.add('lit');
      f.style.transform = '';
      f.style.opacity = '';
    });
    hideWish();
  }
  relightBtn.addEventListener('click', relight);

  // ---------------- WISH OVERLAY + CONFETTI ----------------
  function showWish(){
    wishOverlay.classList.add('show');
    startConfetti();
  }
  function hideWish(){
    wishOverlay.classList.remove('show');
    stopConfetti();
  }

  function resizeCanvas(){
    var rect = confettiCanvas.parentElement.getBoundingClientRect();
    confettiCanvas.width = rect.width;
    confettiCanvas.height = rect.height;
  }
  window.addEventListener('resize', resizeCanvas);

  var confettiColors = ['#e8622c','#f6c453','#8a2f2a','#f2e9d8','#c94f4f','#7a9e7e'];

  function startConfetti(){
    resizeCanvas();
    confettiParticles = [];
    var count = 70;
    for(var i=0;i<count;i++){
      confettiParticles.push({
        x: Math.random()*confettiCanvas.width,
        y: -20 - Math.random()*confettiCanvas.height*0.5,
        r: 3 + Math.random()*4,
        c: confettiColors[Math.floor(Math.random()*confettiColors.length)],
        vy: 1 + Math.random()*2.2,
        vx: (Math.random()-0.5)*1.4,
        rot: Math.random()*360,
        vr: (Math.random()-0.5)*8
      });
    }
    confettiRunning = true;
  }
  function stopConfetti(){
    confettiRunning = false;
    ctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
  }
  function stepConfetti(){
    ctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
    var h = confettiCanvas.height;
    var anyAlive = false;
    confettiParticles.forEach(function(p){
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      if(p.y < h + 20) anyAlive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI/180);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.r, -p.r*0.4, p.r*2, p.r*0.8);
      ctx.restore();
    });
    if(!anyAlive){
      // relaunch a wave for a lively continuous effect while overlay shown
      confettiParticles.forEach(function(p){
        p.y = -20 - Math.random()*40;
        p.x = Math.random()*confettiCanvas.width;
      });
    }
  }

})();

</script>
